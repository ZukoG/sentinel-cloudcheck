name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only checks code, it never deploys or writes back.
permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Python version as the Lambda runtime in infra/main.tf.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      # Same Terraform version used locally to build the lock file.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - run: terraform fmt -check -recursive

      # -backend=false: validate needs providers installed, but not AWS
      # credentials or any state. CI never talks to AWS.
      - run: terraform init -backend=false -input=false

      - run: terraform validate
